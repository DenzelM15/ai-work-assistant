<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Work Assistant</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            color: #1f2937;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        h1 { margin-top: 0; color: #111827; font-size: 24px; }
        label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: 14px; }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        textarea { height: 120px; resize: vertical; }
        button {
            margin-top: 16px;
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #93c5fd; cursor: not-allowed; }
        
        .output-container {
            position: relative;
            margin-top: 24px;
        }
        .output-box {
            padding: 15px;
            background: #f9fafb;
            border-left: 4px solid #2563eb;
            border-radius: 4px;
            min-height: 50px;
            white-space: pre-wrap;
            font-size: 15px;
            line-height: 1.6;
        }
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: auto;
            margin-top: 0;
            padding: 6px 12px;
            font-size: 12px;
            background-color: #4b5563;
        }
        .copy-btn:hover { background-color: #374151; }
    </style>
</head>
<body>

<div class="container">
    <h1>💼 AI Career & Work Assistant</h1>
    <p style="color: #6b7280; font-size: 14px; margin-bottom: 20px;">Paste a job description or text to generate a summary and personalized outreach instantly.</p>
    
    <label for="name">Target Contact Name</label>
    <input type="text" id="name" placeholder="e.g. David Miller (Optional)">

    <label for="content">Source Text / Document Content</label>
    <textarea id="content" placeholder="Paste the text layout or description here..."></textarea>

    <button id="submitBtn">Generate Assets</button>

    <div class="output-container">
        <label>Resulting Output</label>
        <button id="copyBtn" class="copy-btn">📋 Copy Result</button>
        <div id="output" class="output-box">Your generated workspace modules will stream out here...</div>
    </div>
</div>

<script>
    const submitBtn = document.getElementById('submitBtn');
    const copyBtn = document.getElementById('copyBtn');
    const outputDiv = document.getElementById('output');

    submitBtn.addEventListener('click', async () => {
        const targetContactName = document.getElementById('name').value;
        const content = document.getElementById('content').value;

        if (!content.trim()) {
            alert('Please paste some source text content first.');
            return;
        }

        outputDiv.textContent = '';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Analyzing and Streaming...';
        copyBtn.textContent = '📋 Copy Result';

        try {
            const response = await fetch('/api/assist', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content, targetContactName })
            });

            if (!response.ok) throw new Error('Failed response transmission');

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                outputDiv.textContent += decoder.decode(value, { stream: true });
            }
        } catch (err) {
            outputDiv.textContent = 'System Error: Unable to complete stream connection.';
            console.error(err);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Generate Assets';
        }
    });

    // Copy to clipboard functionality
    copyBtn.addEventListener('click', async () => {
        const textToCopy = outputDiv.textContent;
        if (!textToCopy || textToCopy.startsWith('Your generated workspace')) return;

        try {
            await navigator.clipboard.writeText(textToCopy);
            copyBtn.textContent = '✅ Copied!';
            setTimeout(() => {
                copyBtn.textContent = '📋 Copy Result';
            }, 2000);
        } catch (err) {
            alert('Failed to copy text.');
        }
    });
</script>

</body>
</html>
